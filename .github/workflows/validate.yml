name: Validate manifests

on:
  pull_request:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate repository
        run: ./scripts/validate.sh
