apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: discourse-vault
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: discourse
          serviceAccountRef:
            name: discourse-external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-runtime
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: discourse-vault
  target:
    name: discourse-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: DISCOURSE_DB_PASSWORD
      remoteRef: { key: discourse_db_password, property: value }
    - secretKey: DISCOURSE_SECRET_KEY_BASE
      remoteRef: { key: discourse_secret_key_base, property: value }
    - secretKey: DISCOURSE_ADMIN_PASSWORD
      remoteRef: { key: discourse_admin_password, property: value }
    - secretKey: DISCOURSE_INTEGRATION_API_KEY
      remoteRef: { key: discourse_integration_api_key, property: value }
    - secretKey: DISCOURSE_REDIS_PASSWORD
      remoteRef: { key: redis, property: password }
    - secretKey: DISCOURSE_SMTP_PASSWORD
      remoteRef: { key: cloudflare-smtp-secret, property: value }
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef: { key: graphql-kafka-async-username, property: value }
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef: { key: graphql-kafka-async-password, property: value }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-ghcr
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: discourse-vault
  target:
    name: discourse-ghcr
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: k8s-rules-engine-github-packages-username, property: value }
    - secretKey: token
      remoteRef: { key: k8s-rules-engine-github-packages-token, property: value }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discourse-db-tunnel
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: discourse-vault
  target:
    name: discourse-db-tunnel
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: DB_TUNNEL_HOST
      remoteRef: { key: directus_db_ssh_tunnel_host, property: value }
    - secretKey: DB_TUNNEL_PRIVATE_KEY_B64
      remoteRef: { key: directus_db_ssh_private_key_b64, property: value }
