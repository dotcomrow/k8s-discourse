apiVersion: batch/v1
kind: CronJob
metadata:
  name: discourse-backup
  namespace: discourse
  labels:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  schedule: "15 3 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: discourse
            app.kubernetes.io/component: backup
          annotations:
            config.linkerd.io/skip-outbound-ports: "22,6379"
        spec:
          restartPolicy: Never
          serviceAccountName: discourse-backup
          imagePullSecrets:
            - name: discourse-ghcr
          initContainers:
            - name: database-tunnel
              image: alpine:3.22
              imagePullPolicy: IfNotPresent
              restartPolicy: Always
              command: ["/bin/sh", "/opt/tunnel/start.sh"]
              env:
                - name: DB_TUNNEL_HOST
                  valueFrom:
                    secretKeyRef: { name: discourse-db-tunnel, key: DB_TUNNEL_HOST }
                - name: DB_TUNNEL_PRIVATE_KEY_B64
                  valueFrom:
                    secretKeyRef: { name: discourse-db-tunnel, key: DB_TUNNEL_PRIVATE_KEY_B64 }
              startupProbe:
                exec:
                  command: ["/bin/sh", "-c", "nc -z 127.0.0.1 15432"]
                periodSeconds: 2
                failureThreshold: 60
              volumeMounts:
                - name: database-tunnel-script
                  mountPath: /opt/tunnel
                  readOnly: true
          containers:
            - name: backup
              image: ghcr.io/dotcomrow/discourse:latest
              imagePullPolicy: Always
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  cd /var/www/discourse
                  exec sudo -H -E -u discourse bundle exec rails runner \
                    'require "backup_restore"; BackupRestore.backup!(Discourse.system_user.id, publish_to_message_bus: false, with_uploads: SiteSetting.backup_with_uploads, fork: false)'
              envFrom:
                - secretRef:
                    name: discourse-runtime
              env:
                - { name: RAILS_ENV, value: production }
                - { name: DISCOURSE_HOSTNAME, value: discourse.teleport.app.suncoast.systems }
                - { name: DISCOURSE_DB_SOCKET, value: "" }
                - { name: DISCOURSE_DB_HOST, value: "127.0.0.1" }
                - { name: DISCOURSE_DB_PORT, value: "15432" }
                - { name: DISCOURSE_DB_NAME, value: discourse }
                - { name: DISCOURSE_DB_USERNAME, value: discourse }
                - { name: DISCOURSE_REDIS_HOST, value: redis-primary.redis.svc.cluster.local }
                - { name: DISCOURSE_REDIS_PORT, value: "6379" }
                - { name: DISCOURSE_REDIS_DB, value: "4" }
                - { name: DISCOURSE_MAX_BACKUPS, value: "14" }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits: { cpu: "2", memory: 2Gi }
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            - name: database-tunnel-script
              configMap:
                name: discourse-db-tunnel
                defaultMode: 0555
            - name: shared
              persistentVolumeClaim:
                claimName: discourse-shared
