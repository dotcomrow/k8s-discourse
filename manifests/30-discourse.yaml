apiVersion: apps/v1
kind: Deployment
metadata:
  name: discourse
  namespace: discourse
  labels:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discourse
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discourse
        app.kubernetes.io/component: web
      annotations:
        config.linkerd.io/skip-outbound-ports: "22,6379"
        reloader.stakater.com/auto: "true"
    spec:
      serviceAccountName: discourse
      imagePullSecrets:
        - name: discourse-ghcr
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: database-tunnel
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["/bin/sh", "/opt/tunnel/start.sh"]
          env:
            - name: DB_TUNNEL_HOST
              valueFrom:
                secretKeyRef: { name: discourse-db-tunnel, key: DB_TUNNEL_HOST }
            - name: DB_TUNNEL_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef: { name: discourse-db-tunnel, key: DB_TUNNEL_PRIVATE_KEY_B64 }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "nc -z 127.0.0.1 15432"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: database-tunnel-script
              mountPath: /opt/tunnel
              readOnly: true
      containers:
        - name: discourse
          image: ghcr.io/dotcomrow/discourse:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: discourse-runtime
          env:
            - { name: DISCOURSE_HOSTNAME, value: discourse.teleport.app.suncoast.systems }
            - { name: DISCOURSE_FORCE_HTTPS, value: "true" }
            - { name: DISCOURSE_ENABLE_LOCAL_LOGINS, value: "false" }
            - { name: DISCOURSE_ENABLE_LOCAL_LOGINS_VIA_EMAIL, value: "false" }
            - { name: DISCOURSE_ENABLE_LOCAL_LOGINS_VIA_CODE, value: "false" }
            - { name: DISCOURSE_DEVELOPER_EMAILS, value: administrator@suncoast.systems }
            - { name: DISCOURSE_OPENID_CONNECT_ENABLED, value: "true" }
            - { name: DISCOURSE_OPENID_CONNECT_DISCOVERY_DOCUMENT, value: "https://auth.suncoast.systems/realms/internal/.well-known/openid-configuration" }
            - { name: DISCOURSE_OPENID_CONNECT_CLIENT_ID, value: discourse }
            - { name: DISCOURSE_OPENID_CONNECT_USE_PKCE, value: "true" }
            - { name: DISCOURSE_OPENID_CONNECT_AUTHORIZE_SCOPE, value: "openid profile email" }
            - { name: DISCOURSE_OPENID_CONNECT_GROUPS_CLAIM, value: suncoast_roles }
            - { name: DISCOURSE_OPENID_CONNECT_MATCH_BY_EMAIL, value: "true" }
            - { name: DISCOURSE_OPENID_CONNECT_EMAIL_VERIFIED_CLAIM_FALLBACK, value: "false" }
            - { name: DISCOURSE_DB_SOCKET, value: "" }
            - { name: DISCOURSE_DB_HOST, value: "127.0.0.1" }
            - { name: DISCOURSE_DB_PORT, value: "15432" }
            - { name: DISCOURSE_DB_NAME, value: discourse }
            - { name: DISCOURSE_DB_USERNAME, value: discourse }
            - { name: DISCOURSE_REDIS_HOST, value: redis-primary.redis.svc.cluster.local }
            - { name: DISCOURSE_REDIS_PORT, value: "6379" }
            - { name: DISCOURSE_REDIS_DB, value: "4" }
            - { name: DISCOURSE_SMTP_ADDRESS, value: smtp.mx.cloudflare.net }
            - { name: DISCOURSE_SMTP_PORT, value: "465" }
            - { name: DISCOURSE_SMTP_FORCE_TLS, value: "true" }
            - { name: DISCOURSE_SMTP_USER_NAME, value: api_token }
            - { name: DISCOURSE_NOTIFICATION_EMAIL, value: administrator@suncoast.systems }
            - { name: MIGRATE_ON_BOOT, value: "1" }
            - { name: PRECOMPILE_ON_BOOT, value: "1" }
            - { name: UNICORN_WORKERS, value: "2" }
          startupProbe:
            httpGet: { path: /srv/status, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /srv/status, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /srv/status, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "4", memory: 6Gi }
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: database-tunnel-script
          configMap:
            name: discourse-db-tunnel
            defaultMode: 0555
        - name: shared
          persistentVolumeClaim:
            claimName: discourse-shared
---
apiVersion: v1
kind: Service
metadata:
  name: discourse
  namespace: discourse
  labels:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: web
    teleport.dev/enroll: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    teleport.dev/name: discourse
    teleport.dev/protocol: http
    teleport.dev/public-addr: discourse.teleport.app.suncoast.systems
    teleport.dev/description: Suncoast Systems Discourse
spec:
  selector:
    app.kubernetes.io/name: discourse
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
