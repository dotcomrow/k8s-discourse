apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discourse-shared
  namespace: discourse
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Gi
