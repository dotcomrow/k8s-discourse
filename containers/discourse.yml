templates:
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"

params:
  version: "97c86cedd020484e0fd51e8739ade8474352fec7"
  upload_size: "100m"

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LANGUAGE: en_US.UTF-8
  DISCOURSE_HOSTNAME: discourse.teleport.app.suncoast.systems
  DISCOURSE_FORCE_HTTPS: "true"
  DISCOURSE_SMTP_ADDRESS: smtp.mx.cloudflare.net
  DISCOURSE_SMTP_PORT: "465"
  DISCOURSE_SMTP_FORCE_TLS: "true"
  DISCOURSE_SMTP_USER_NAME: api_token
  DISCOURSE_NOTIFICATION_EMAIL: administrator@suncoast.systems
  DISCOURSE_DB_SOCKET: ""
  DISCOURSE_DB_HOST: 127.0.0.1
  DISCOURSE_DB_PORT: "15432"
  DISCOURSE_DB_NAME: discourse
  DISCOURSE_DB_USERNAME: discourse
  DISCOURSE_REDIS_HOST: redis-primary.redis.svc.cluster.local
  DISCOURSE_REDIS_PORT: "6379"
  DISCOURSE_REDIS_DB: "4"

volumes:
  - volume:
      host: /var/discourse/shared/discourse
      guest: /shared
  - volume:
      host: /var/discourse/shared/discourse/log/var-log
      guest: /var/log

hooks:
  after_code:
    - exec: mkdir -p $home/plugins/discourse-suncoast-admin-sync
    - file:
        path: $home/plugins/discourse-suncoast-admin-sync/plugin.rb
        contents: |
          # frozen_string_literal: true

          # name: discourse-suncoast-admin-sync
          # about: Reconciles Suncoast OIDC membership with Discourse administrator access
          # version: 1.0.0
          # authors: Suncoast Systems

          module ::SuncoastDiscourseAdminSync
            ADMIN_ROLE = "k8s_discourse_admins"
            OIDC_PROVIDER = "oidc"
            RECOVERY_ADMIN_USERNAME = "administrator"

            def self.reconcile(user)
              return if user.blank? || user.id.blank?

              should_be_admin =
                user
                  .associated_groups
                  .where(provider_name: OIDC_PROVIDER, provider_id: ADMIN_ROLE)
                  .exists?

              if should_be_admin && !user.admin?
                user.grant_admin!
                Rails.logger.warn(
                  "Suncoast OIDC admin sync granted admin user_id=#{user.id} role=#{ADMIN_ROLE}",
                )
              elsif !should_be_admin && user.admin? && user.username != RECOVERY_ADMIN_USERNAME
                user.revoke_admin!
                Rails.logger.warn(
                  "Suncoast OIDC admin sync revoked admin user_id=#{user.id} role=#{ADMIN_ROLE}",
                )
              end
            rescue StandardError => e
              Rails.logger.error(
                "Suncoast OIDC admin sync failed user_id=#{user&.id}: #{e.class}: #{e.message}",
              )
            end

            module UserAssociatedGroupExtension
              extend ActiveSupport::Concern

              included do
                after_commit :reconcile_suncoast_oidc_admin
              end

              private

              def reconcile_suncoast_oidc_admin
                SuncoastDiscourseAdminSync.reconcile(user)
              end
            end
          end

          after_initialize do
            reloadable_patch do
              UserAssociatedGroup.include(
                SuncoastDiscourseAdminSync::UserAssociatedGroupExtension,
              )
            end

            DiscourseEvent.on(:user_logged_in) do |user|
              SuncoastDiscourseAdminSync.reconcile(user)
            end
          end
    - exec: chown -R discourse:www-data $home/plugins/discourse-suncoast-admin-sync

run:
  - exec: echo "Suncoast Discourse image build complete"
  - exec:
      cmd: sed -i '/listen \[::\]:80;/d' /etc/nginx/conf.d/outlets/server/10-http.conf
